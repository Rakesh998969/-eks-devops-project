
name: CI - Build Scan and Push

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/backend/values.yaml'
      - 'helm/frontend/values.yaml'

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  FRONTEND_ECR_REPOSITORY: eks-devops-project-frontend
  BACKEND_ECR_REPOSITORY: eks-devops-project-backend

jobs:
  sonarqube:
    name: SonarQube Analysis and Quality Gate
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@master
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  trivy:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  build-and-push:
    name: Build Scan and Push Images
    runs-on: ubuntu-latest
    needs:
      - trivy

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check GitHub Actions context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"

      - name: Check OIDC token claims
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request
          from urllib.parse import urlencode

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          token_request = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          url += ("&" if "?" in url else "?") + urlencode(
              {"audience": "sts.amazonaws.com"}
          )

          request = urllib.request.Request(
              url,
              headers={"Authorization": f"Bearer {token_request}"}
          )

          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in ("iss", "aud", "sub", "repository", "ref"):
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_ECR_REPOSITORY }}:${{ github.sha }} \
            ./app/backend

      - name: Build frontend Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_ECR_REPOSITORY }}:${{ github.sha }} \
            ./app/frontend

      - name: Scan backend Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_ECR_REPOSITORY }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan frontend Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_ECR_REPOSITORY }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push backend image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_ECR_REPOSITORY }}:${{ github.sha }}

      - name: Push frontend image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_ECR_REPOSITORY }}:${{ github.sha }}

      - name: Update Helm image tags
        env:
          IMAGE_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import sys

          registry = os.environ["IMAGE_REGISTRY"]
          tag = os.environ["IMAGE_TAG"]

          images = {
              "helm/backend/values.yaml":
                  f"{registry}/{os.environ['BACKEND_ECR_REPOSITORY']}",
              "helm/frontend/values.yaml":
                  f"{registry}/{os.environ['FRONTEND_ECR_REPOSITORY']}",
          }

          for filename, repository in images.items():
              path = Path(filename)
              content = path.read_text()

              content, repo_count = re.subn(
                  r'(?m)^  repository:.*$',
                  f'  repository: {repository}',
                  content,
              )
              content, tag_count = re.subn(
                  r'(?m)^  tag:.*$',
                  f'  tag: {tag}',
                  content,
              )

              if repo_count != 1 or tag_count != 1:
                  sys.exit(
                      f"Expected one repository and one tag in {filename}; "
                      f"found repository={repo_count}, tag={tag_count}"
                  )

              path.write_text(content)
              print(f"Updated {filename} to image tag {tag}")
          PY

      - name: Commit GitOps image update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/backend/values.yaml helm/frontend/values.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes detected."
            exit 0
          fi

          git commit -m "chore: update image tags to ${GITHUB_SHA}"
          git push origin HEAD:main
